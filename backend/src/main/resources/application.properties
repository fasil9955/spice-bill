# Server Configuration
server.port=8080
spring.application.name=spices-billing-system

# Use WebConfig resource handlers (SPA fallback) instead of Boot default
spring.web.resources.add-mappings=false

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/spices_billing_system?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=fasil786313
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# JWT Configuration — tokens stay valid until the user logs out (no expiry)
jwt.secret=your-secret-key-change-this-in-production-use-a-strong-random-key

# File Upload Configuration
file.upload.dir=uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Password reset emails (Gmail: 2-step verification + App Password)
# Set MAIL_USERNAME and MAIL_PASSWORD in the environment, or fill the values below.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=fasilpvr52@gmail.com
spring.mail.password=xpvquqpycpzjoqdm
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:fasilpvr52@gmail.com}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}
app.password-reset.to=fasilpvr52@gmail.com

# Logging
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
