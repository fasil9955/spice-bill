# NEW file only. Install as:
#   /etc/nginx/sites-available/billing.spicesbazar.org
#   ln -s .../billing.spicesbazar.org /etc/nginx/sites-enabled/
# Do NOT edit /etc/nginx/sites-available/spicesbazar.org

server {
    listen 80;
    listen [::]:80;
    server_name billing.spicesbazar.org;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
