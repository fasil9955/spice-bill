<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shop reports</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; }
    .wrap { max-width: 520px; margin: 0 auto; padding: 16px 16px 40px; }
    h1 { font-size: 1.35rem; margin: 0 0 12px; }
    label { display: block; font-size: 0.85rem; margin: 10px 0 4px; color: #cbd5e1; }
    input, select, button { width: 100%; box-sizing: border-box; font-size: 1rem; padding: 12px; border-radius: 10px; border: 1px solid #334155; }
    input, select { background: #1e293b; color: #fff; }
    button { background: #4f46e5; color: #fff; font-weight: 700; border: none; margin-top: 12px; }
    button.secondary { background: #334155; }
    .card { background: #1e293b; border-radius: 14px; padding: 14px; margin: 10px 0; }
    .row { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px solid #334155; }
    .row:last-child { border-bottom: none; }
    .muted { color: #94a3b8; font-size: 0.85rem; }
    .err { color: #fca5a5; }
    .bar { height: 8px; background: #312e81; border-radius: 99px; margin-top: 4px; overflow: hidden; }
    .bar > i { display: block; height: 100%; background: #818cf8; }
  </style>
</head>
<body>
  <div class="wrap" id="app"></div>
  <script>
    const money = (v) => '₹' + Number(v || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const n = (v) => Number(v || 0);
    const today = () => new Date().toISOString().slice(0, 10);
    let token = sessionStorage.getItem('bossToken') || '';
    let shops = [];
    let shopId = '';
    let date = today();

    async function api(path, opts = {}) {
      const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
      if (token) headers.Authorization = 'Bearer ' + token;
      const res = await fetch(path, { ...opts, headers });
      const data = await res.json().catch(() => ({}));
      if (res.status === 401) { token = ''; sessionStorage.removeItem('bossToken'); throw new Error('Login expired'); }
      if (!res.ok) throw new Error(data.error || 'Request failed');
      return data;
    }

    function renderLogin(err) {
      document.getElementById('app').innerHTML = `
        <h1>Boss reports</h1>
        <p class="muted">Daily sales from each shop PC. Billing stays in the shop.</p>
        ${err ? `<p class="err">${err}</p>` : ''}
        <label>PIN</label>
        <input id="pin" type="password" inputmode="numeric" />
        <button id="go">Open</button>`;
      document.getElementById('go').onclick = async () => {
        try {
          const out = await api('/api/login', { method: 'POST', body: JSON.stringify({ pin: document.getElementById('pin').value }) });
          token = out.token;
          sessionStorage.setItem('bossToken', token);
          await loadHome();
        } catch (e) { renderLogin(e.message); }
      };
    }

    async function loadHome() {
      shops = await api('/api/shops');
      shopId = shopId || (shops[0] && shops[0].shop_id) || '';
      const pack = shopId ? await api(`/api/day-pack?shopId=${encodeURIComponent(shopId)}&date=${date}`) : { snapshot: null, expenses: [], employees: [], order: [], payments: [] };
      const year = date.slice(0, 4);
      const monthly = shopId ? await api(`/api/monthly?shopId=${encodeURIComponent(shopId)}&year=${year}`) : [];
      const maxSales = Math.max(1, ...monthly.map((m) => m.sales || 0));
      const d = pack.snapshot;
      const shopOpts = shops.map((s) => `<option value="${s.shop_id}" ${s.shop_id === shopId ? 'selected' : ''}>${s.display_name}</option>`).join('');
      const expHtml = (pack.expenses || []).length
        ? pack.expenses.map((e) => `<div class="row"><span>${e.item_name} <span class="muted">${e.payment_method || ''}</span></span><span>${money(e.amount)}</span></div>`).join('')
        : '<p class="muted">No expenses on this snapshot.</p>';
      const empHtml = (pack.employees || []).length
        ? pack.employees.map((e) => `<div class="row" style="flex-direction:column;align-items:stretch;gap:2px"><strong>${e.employee_name}</strong><span class="muted">${e.designation || ''} ${e.phone || ''}</span><span>Salary ${money(e.salary)} · Taken ${money(e.taken)} · Net ${money(e.net_pay)}</span></div>`).join('')
        : '<p class="muted">No staff rows on this snapshot.</p>';
      const order = pack.order || [];
      const pays = pack.payments || [];
      const systemSales = d ? (n(d.system_sales) || (n(d.billing_book_sales) ? 0 : n(d.total_sales))) : 0;
      const billingBook = d ? n(d.billing_book_sales) : 0;
      const totalSales = d ? (n(d.system_sales) || n(d.billing_book_sales) ? systemSales + billingBook : n(d.total_sales)) : 0;
      const payHtml = pays.length
        ? pays.map((p) => `<div class="row"><span>${p.item_name} (${p.payment_method || ''})</span><span>${money(p.amount)}</span></div>`).join('')
        : `<div class="row"><span>Card</span><span>${d ? money(d.payment_card) : '—'}</span></div>
           <div class="row"><span>UPI</span><span>${d ? money(d.payment_upi) : '—'}</span></div>`;
      const payTotal = d ? n(d.payment_card) + n(d.payment_upi) + n(d.closing_cash) + n(d.closing_upi) : 0;
      const bal = d ? n(d.balance_result) : 0;
      const balWord = bal < 0 ? 'more' : bal > 0 ? 'shortage' : 'tally';
      document.getElementById('app').innerHTML = `
        <h1>Boss reports</h1>
        <label>Shop</label>
        <select id="shop">${shopOpts}</select>
        <label>Date</label>
        <input id="dt" type="date" value="${date}" />
        <div class="card">
          <strong>Accounting &amp; Day Close</strong>
          <p class="muted">Date ${date}${d && d.company_name ? ' · ' + d.company_name : ''}</p>
          <div class="muted" style="margin-top:10px">Sales</div>
          <div class="row"><span>System Sales</span><span>${d ? money(systemSales) : '—'}</span></div>
          <div class="row"><span>Billing Book</span><span>${d ? money(billingBook) : '—'}</span></div>
          <div class="row"><span><strong>Total Sales</strong></span><span style="font-size:1.25rem;font-weight:800">${d ? money(totalSales) : '—'}</span></div>
          <div class="muted" style="margin-top:10px">Opening Balance</div>
          <div class="row"><span>Cash</span><span>${d ? money(d.opening_cash) : '—'}</span></div>
          ${d && n(d.opening_upi) ? `<div class="row"><span>UPI</span><span>${money(d.opening_upi)}</span></div>` : ''}
          <div class="muted" style="margin-top:10px">Expenses</div>
          ${expHtml}
          <div class="row"><span><strong>Total Expenses</strong></span><span>${d ? money(d.expenses) : '—'}</span></div>
          <div class="muted" style="margin-top:10px">Payments (Card+GPay+Cash)</div>
          ${payHtml}
          <div class="row"><span>Cash Balance</span><span>${d ? money(d.closing_cash) : '—'}</span></div>
          ${d && n(d.closing_upi) ? `<div class="row"><span>UPI Balance</span><span>${money(d.closing_upi)}</span></div>` : ''}
          <div class="row"><span><strong>Total</strong></span><span>${d ? money(payTotal) : '—'}</span></div>
          <p style="text-align:center;font-weight:800;margin:12px 0 0">${d ? balWord + ': ' + money(Math.abs(bal)) : ''}</p>
          ${d ? '' : '<p class="muted">No snapshot yet. Print day-close at the shop after the hub update.</p>'}
        </div>
        <div class="card">
          <strong>Employees &amp; salary</strong>
          ${empHtml}
        </div>
        <div class="card">
          <strong>Required order</strong>
          ${order.length ? order.map((o) => `<div class="row"><span>${o.product_name}</span><span>${o.quantity} / min ${o.min_stock_level}</span></div>`).join('') : '<p class="muted">None on this snapshot.</p>'}
        </div>
        <div class="card">
          <strong>Monthly ${year}</strong>
          ${monthly.length ? monthly.map((m) => `<div style="margin:10px 0"><div class="row"><span>M${m.month}</span><span>${money(m.sales)}</span></div><div class="bar"><i style="width:${Math.round(100 * (m.sales || 0) / maxSales)}%"></i></div></div>`).join('') : '<p class="muted">Graphs fill after shops sync.</p>'}
        </div>
        <button class="secondary" id="out">Log out</button>`;
      document.getElementById('shop').onchange = (e) => { shopId = e.target.value; loadHome(); };
      document.getElementById('dt').onchange = (e) => { date = e.target.value; loadHome(); };
      document.getElementById('out').onclick = () => { token = ''; sessionStorage.removeItem('bossToken'); renderLogin(); };
    }

    if (token) loadHome().catch(() => renderLogin());
    else renderLogin();
  </script>
</body>
</html>
